# humantype configuration
# Every value can be overridden on the command line for `humantype type`
# (see --help).  A profile written by `humantype calibrate` overrides the
# sections it contains when passed with --profile.

typing:
  wpm: 45
  countdown: 5
  error_rate: 0.03          # fraction of words that contain a typo
  uncorrected_rate: 0.0     # fraction of typos left uncorrected (0 = exact)
  thinking_pause_rate: 0.001  # per character
  thinking_pause_min: 2.0
  thinking_pause_max: 15.0
  word_autocorrect: on      # on = assume Word AutoCorrect is enabled
  keep_originals: false     # keep smart quotes/dashes instead of normalizing
  seed: null                # set an integer for reproducible runs
  backend: pynput           # pynput | pyautogui
  allow_mouse: false

timing:
  lognormal_sigma: 0.32
  min_delay: 0.02
  max_delay: 2.0
  common_bigram_speed: 0.85
  capital_slow: 1.25
  digit_slow: 1.30
  punctuation_slow: 1.35
  same_finger_slow: 1.30
  alternate_hand_speed: 0.90
  burst_speed: 0.90
  error_cluster_slow: 1.10
  word_pause_mean: 0.12
  word_pause_min: 0.02
  word_pause_max: 0.40
  comma_pause_mean: 0.22
  comma_pause_min: 0.10
  comma_pause_max: 0.45
  sentence_pause_mean: 0.45
  sentence_pause_min: 0.25
  sentence_pause_max: 0.90
  paragraph_pause_mean: 1.50
  paragraph_pause_min: 0.80
  paragraph_pause_max: 3.00
  chunk_pause_min: 0.40
  chunk_pause_max: 2.00
  chunk_words_min: 3
  chunk_words_max: 8
  hold_min: 0.060
  hold_max: 0.130
  backspace_delay: 0.10
  warmup_factor: 0.85
  warmup_seconds: 300
  fatigue_factor: 0.85
  fatigue_onset_seconds: 1800
  fatigue_full_seconds: 3600

errors:
  substitution_weight: 0.35
  transposition_weight: 0.25
  doubled_weight: 0.15
  dropped_weight: 0.15
  shift_late_weight: 0.05
  lose_place_weight: 0.05
  notice_after_max: 4
  late_correction_rate: 0.20
  late_words_max: 3
  error_cluster_window: 3
  error_cluster_factor: 1.8
  long_word_threshold: 8
  long_word_factor: 1.6
  rare_word_factor: 1.5
  burst_error_factor: 1.3
  lose_place_probability: 0.003

pauses:
  idle_rate_per_hour: 1.2
  idle_min: 30
  idle_max: 180

sessions:
  count: 1
  schedule: []     # break lengths in minutes between sessions, e.g. [10, 30]

logging:
  output: null     # null -> auto humantype_log_YYYYmmdd_HHMMSS.csv
  progress_file: .humantype_progress.json
  # Auto-save via Ctrl+S is OFF by default: on an unsaved blank Word document,
  # Ctrl+S opens the Save As dialog and keystrokes go into the filename box.
  # Set to e.g. 4 only when typing into a document that already has a path.
  save_interval_minutes: 0
  dry_run_max_events: 0

hotkeys:
  pause: F8
  abort: F9
